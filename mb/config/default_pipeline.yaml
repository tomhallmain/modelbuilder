# Default pipeline / ML job configuration (model, data, training, paths).
# Loaded by mb.pipeline_config — not the desktop shell (see mb/config/application.example.yaml).

model:
  default_type: image_classification
  default_framework: pytorch
  default_architecture: resnet34

data:
  raw_data_dir: raw_data
  # Train/test dataset root (train/, test/) after create-dataset; separate from raw_data_dir.
  data_dir: data
  # Per-class test count (fixed mode); also the anchor for dataset_weighted — no separate anchor key.
  test_per_class: 1000
  # fixed | dataset_weighted (modulated test counts by class size — see mb.data.dataset)
  test_split_mode: fixed
  # null = same as test_per_class (anchor); used only when test_split_mode is dataset_weighted
  test_small_class_threshold: null
  # Optional default RNG seed for create-dataset; CLI --seed overrides when passed.
  seed: null
  image_size: 224
  # null = omit from training merge so the model type’s default batch size applies
  batch_size: null
  image_types:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
    - .webp
    - .bmp
    - .gif
    - .heic
    - .avif
  video_types:
    - .mp4
    - .mkv
    - .avi
    - .wmv
    - .mov
    - .flv
  # single_label | multi_label — multi_label reads label_schema.json and labels.jsonl under
  # data_dir and trains independent per-label sigmoids (PyTorch only).
  label_mode: single_label
  # null = discover subdirs of raw_data_dir; optional explicit class folder names
  class_names: null
  # null = any class folder layout under raw data; else require raw_data/<class>/<this_subdir>/…
  class_qualifying_subdir: null
  # mb data gather / ImageGatherer defaults (gather → convert → create-dataset).
  # default_target_dir / default_rejected_dir are under data.raw_data_dir unless absolute.
  gather:
    default_target_count: 100000
    default_target_dir: coherent
    default_rejected_dir: rejected

training:
  frozen_epochs: 5
  unfrozen_epochs: 20
  frozen_lr: 0.001
  unfrozen_lr_max: 0.0003
  unfrozen_lr_min: 0.00001
  num_workers: 12
  store_checkpoints: false
  # none | inverse_frequency — compensate an imbalanced training set by weighting the
  # training loss (see mb.training.class_weights). Validation loss stays unweighted.
  class_weighting: none
  # Ceiling on any single class weight; used only when class_weighting is inverse_frequency.
  class_weight_max: 50.0

paths:
  models_dir: data/models
  logs_dir: logs

# Text classification (model.default_type: text_classification). Trained with
# `mb train --model-type text_classification`; checked/evaluated/scored/compared with `mb text`.
# Unlike the sections above, unknown keys and invalid values here are errors, not defaults.
text_classification:
  # Directory with dataset.tsv (text, label, split; optional tier, source, category_hint,
  # group and reference_score_column) plus optional manifest.json, label_conflicts.tsv and
  # unlabeled_file.
  data_dir: text_dataset
  # Each run writes <runs_dir>/<timestamp>_<backend>_<model-slug>/.
  runs_dir: data/models/text_runs
  # char_ngram_linear | embedding_probe | encoder_finetune
  backend: char_ngram_linear
  # Hugging Face id or local path; null = the backend's default (none for char_ngram_linear).
  model_id: null
  seed: 13
  # Token limit for subword models; rows longer than this are counted and reported.
  max_length: 64
  # none | balanced | {0: w0, 1: w1}
  class_weight: balanced
  # Per-tier loss multiplier, e.g. {unreviewed: 0.5}; unlisted tiers get 1.0.
  tier_weight: {}
  # Drop label_conflicts.tsv groups from training and from every metric.
  exclude_conflicts: true
  # Tier whose labels were not human-checked; subsample_unreviewed thins it and the review
  # queue draws from it. null = no such tier.
  unreviewed_tier: null
  # null, or keep this many train unreviewed_tier rows per train positive (val/test untouched).
  subsample_unreviewed: null
  # Tiers forming the "gold" evaluation set (the headline metrics); null = every row.
  gold_tiers: null
  # Optional numeric column (dataset.tsv and unlabeled_file) with a score from another model
  # or heuristic; reported as rank correlation with this model's scores.
  reference_score_column: reference_score
  # Optional file in data_dir with a `text` column, scored for a report and never trained on.
  unlabeled_file: unlabeled.tsv
  optim:
    # null = backend default.
    lr: null
    epochs: null
    batch_size: null
    warmup_ratio: 0.06
    weight_decay: 0.01
  early_stopping:
    metric: val_ap
    patience: 2
  # auto (temperature for neural backends, platt for linear) | temperature | platt | isotonic
  calibration: auto
  # kind picks the decision threshold; both policies are chosen on val gold at `value`.
  threshold_policy:
    kind: precision_target
    value: 0.9
  reports:
    # unreviewed_tier rows (all splits) whose score most disagrees with their label, written as
    # a review queue; 0 disables.
    review_queue_size: 200
    # Score unlabeled_file (when present) into unlabeled_scores.tsv.
    score_unlabeled: true
  # Markdown placed in MODEL_CARD.md under "Intended use and label policy".
  model_card_notes: ""
  # null = cuda when available, else cpu.
  device: null
  # Backend-specific settings (each backend rejects keys it does not know).
  backend_options: {}
