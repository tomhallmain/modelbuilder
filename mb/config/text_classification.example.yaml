# Example pipeline for a text-classification project: a binary classifier over short strings.
# Copy it, adjust, then:
#
#   mb --config my_text_pipeline.yaml text verify
#   mb --config my_text_pipeline.yaml train
#   mb text evaluate --model data/models/text_runs/<run>
#   mb text score --model data/models/text_runs/<run> --input lines.txt --output scores.tsv
#   mb text compare "data/models/text_runs/*"
#
# Only the sections that differ from the shipped defaults need to be present; everything else
# merges in from mb/config/default_pipeline.yaml.

model:
  default_type: text_classification

text_classification:
  data_dir: my_text_dataset
  runs_dir: data/models/text_runs

  # Cheapest baseline first. Other families, each with its own model_id:
  #   embedding_probe   model_id: Qwen/Qwen3-Embedding-0.6B
  #   encoder_finetune  model_id: answerdotai/ModernBERT-base (or -large, microsoft/deberta-v3-base)
  backend: char_ngram_linear
  model_id: null
  seed: 13
  max_length: 64

  class_weight: balanced
  # With a `tier` column: the tiers forming the gold evaluation set (null = every row), and a
  # tier of labels nobody checked, which the review queue draws from.
  gold_tiers: null
  unreviewed_tier: null
  # Per-tier loss multipliers, e.g. to down-weight the unreviewed tier:
  # tier_weight: {unreviewed: 0.5}
  tier_weight: {}
  exclude_conflicts: true
  # Cap train unreviewed_tier rows at this many per train positive (null = keep all).
  subsample_unreviewed: null

  threshold_policy:
    kind: precision_target
    value: 0.9

  # Per-backend settings. For embedding_probe, an instruction describing what label 1 means:
  # backend_options:
  #   instruction: >-
  #     Given a word or short phrase, decide whether it <describes what label 1 means>
  #   head: linear
  backend_options: {}

  # Markdown for MODEL_CARD.md's "Intended use and label policy" section. State what label 1
  # means, what the model is for, and what it must not be used for.
  model_card_notes: |
    Output is p(label = 1): <what a positive label means for this dataset>.

    - Intended use: <where the scores are consumed and how>.
    - Known limits: <readings or cases the labelling does not cover>.
